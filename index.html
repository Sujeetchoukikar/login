<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Gateway - Login & Registration</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container auth-container">

    <div id="loginForm">
      <h2>Welcome Back</h2>
      <div class="form-group">
        <label>Registration Number</label>
        <input type="text" id="loginRegNo" placeholder="Enter Registration ID">
      </div>
      <div class="form-group">
        <label>Date of Birth</label>
        <input type="date" id="loginDob">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="••••••••">
      </div>
      <button class="btn-primary" onclick="login()">Sign In</button>
      <p class="footer-text">
        New candidate registration? <span onclick="showSignup()">Create Account</span>
      </p>
    </div>

    <div id="signupForm" class="hidden">
      <h2>Candidate Sign Up</h2>
      <div class="row">
        <div class="form-group">
          <label>First Name</label>
          <input type="text" id="signupFirstname" placeholder="John">
        </div>
        <div class="form-group">
          <label>Last Name</label>
          <input type="text" id="signupLastname" placeholder="Doe">
        </div>
      </div>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="signupEmail" placeholder="name@domain.com">
      </div>
      
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="signupPassword" placeholder="Minimum 8 characters">
        <div id="passwordRequirements" style="margin-top: 10px; font-size: 12px; display: none; flex-direction: column; gap: 6px; padding: 8px 12px; background: #fff5f5; border: 1px solid #fed7d7; border-radius: 6px;">
          <span id="reqCapital" style="color: #e53e3e; display: block;">• Must include 1 Capital Letter</span>
          <span id="reqNumber" style="color: #e53e3e; display: block;">• Must include 1 Number</span>
          <span id="reqSpecial" style="color: #e53e3e; display: block;">• Must include 1 Special Character</span>
        </div>
      </div>

      <div class="form-group">
        <label>Phone Number</label>
        <input type="tel" id="signupPhone" placeholder="10-digit primary number">
      </div>
      <div class="form-group">
        <label>Date of Birth</label>
        <input type="date" id="signupDob">
      </div>
      <button class="btn-primary" onclick="sendOtp()">Request Verification Code</button>
      <p class="footer-text">
        Already have access profiles? <span onclick="showLogin()">Login here</span>
      </p>
    </div>

    <div id="otpForm" class="hidden">
      <h2>Verify Authentication</h2>
      <p id="otpMessage" style="text-align: center; color: var(--text-muted); margin-bottom: 20px; font-size: 14px;"></p>
      <div class="form-group">
        <label>One-Time Password (OTP)</label>
        <input type="text" id="otpInput" placeholder="Enter 6-digit Code" style="text-align:center; letter-spacing: 4px; font-weight: bold;" maxlength="6">
      </div>
      <button class="btn-primary" onclick="verifyOtp()">Confirm & Register</button>
      <p class="footer-text">
        Code expired or missed inbox? <span onclick="sendOtp(true)">Resend Token</span>
      </p>
    </div>

  </div>
  <script src="script.js"></script>
</body>
</html>
